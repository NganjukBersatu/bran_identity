<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .yellow { fill: #FCEF92; }
      .orange { fill: #FB9F37; }
      .deep-orange { fill: #E75119; }
      .red { fill: #EB2B0C; }
      .dark { fill: #2B2B2B; }
      .skin { fill: #F2B98A; }
      .white { fill: #FFFFFF; }
      .grey { fill: #E5E5E5; }
    </style>
  </defs>

  <!-- background blob -->
  <ellipse cx="400" cy="320" rx="330" ry="260" class="yellow" opacity="0.5"/>

  <!-- desk -->
  <rect x="140" y="430" width="520" height="18" rx="4" class="dark" opacity="0.85"/>
  <rect x="170" y="448" width="14" height="90" class="dark" opacity="0.85"/>
  <rect x="616" y="448" width="14" height="90" class="dark" opacity="0.85"/>

  <!-- monitor -->
  <rect x="300" y="230" width="200" height="140" rx="10" class="dark"/>
  <rect x="312" y="242" width="176" height="116" rx="4" class="white"/>
  <rect x="380" y="370" width="40" height="26" class="dark"/>
  <rect x="356" y="396" width="88" height="10" rx="4" class="dark"/>

  <!-- code lines on monitor -->
  <rect x="326" y="256" width="60" height="8" rx="3" class="red"/>
  <rect x="326" y="272" width="100" height="8" rx="3" class="orange"/>
  <rect x="342" y="288" width="80" height="8" rx="3" class="deep-orange"/>
  <rect x="342" y="304" width="60" height="8" rx="3" class="orange"/>
  <rect x="326" y="320" width="90" height="8" rx="3" class="red"/>
  <rect x="326" y="336" width="40" height="8" rx="3" class="deep-orange"/>

  <!-- laptop on the left of desk -->
  <g transform="translate(180,360)">
    <rect x="0" y="0" width="90" height="60" rx="6" class="dark"/>
    <rect x="6" y="6" width="78" height="48" rx="3" class="white"/>
    <rect x="14" y="14" width="40" height="6" rx="2" class="orange"/>
    <rect x="14" y="26" width="55" height="6" rx="2" class="red"/>
    <rect x="14" y="38" width="30" height="6" rx="2" class="deep-orange"/>
    <path d="M -10 60 L 100 60 L 90 72 L 0 72 Z" class="dark" opacity="0.85"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(540,388)">
    <rect x="0" y="10" width="28" height="30" rx="4" class="deep-orange"/>
    <path d="M28 16 Q 42 16 42 26 Q 42 36 28 34" fill="none" stroke="#E75119" stroke-width="4"/>
    <ellipse cx="14" cy="10" rx="14" ry="4" class="dark" opacity="0.85"/>
  </g>

  <!-- chair -->
  <rect x="370" y="470" width="60" height="14" rx="6" class="dark" opacity="0.7"/>
  <rect x="392" y="484" width="16" height="54" class="dark" opacity="0.7"/>

  <!-- person sitting -->
  <g transform="translate(330,270)">
    <!-- body -->
    <path d="M20 90 Q10 140 20 190 L100 190 Q110 140 100 90 Z" class="red"/>
    <!-- head -->
    <circle cx="60" cy="55" r="34" class="skin"/>
    <!-- hair -->
    <path d="M26 50 Q30 10 60 12 Q94 10 94 50 Q94 30 60 28 Q30 28 26 50 Z" class="dark"/>
    <!-- arm left -->
    <path d="M22 100 Q -10 120 -6 160 Q -4 172 10 168 Q 6 140 30 118 Z" class="deep-orange"/>
    <!-- arm right -->
    <path d="M98 100 Q 130 120 126 160 Q 124 172 110 168 Q 114 140 90 118 Z" class="deep-orange"/>
    <!-- hands -->
    <circle cx="6" cy="166" r="10" class="skin"/>
    <circle cx="114" cy="166" r="10" class="skin"/>
  </g>

  <!-- floating code brackets left -->
  <g transform="translate(120,150)">
    <text x="0" y="0" font-family="monospace" font-size="46" font-weight="700" class="orange">&lt;/&gt;</text>
  </g>

  <!-- floating gear right -->
  <g transform="translate(610,150)" class="deep-orange">
    <circle cx="0" cy="0" r="22"/>
    <rect x="-4" y="-32" width="8" height="14" class="deep-orange"/>
    <rect x="-4" y="18" width="8" height="14" class="deep-orange"/>
    <rect x="-32" y="-4" width="14" height="8" class="deep-orange"/>
    <rect x="18" y="-4" width="14" height="8" class="deep-orange"/>
    <circle cx="0" cy="0" r="10" class="white"/>
  </g>

  <!-- floating dots -->
  <circle cx="180" cy="380" r="6" class="red"/>
  <circle cx="650" cy="300" r="8" class="orange"/>
  <circle cx="600" cy="450" r="5" class="deep-orange"/>
  <circle cx="230" cy="180" r="5" class="deep-orange"/>

  <!-- small plant -->
  <g transform="translate(250,400)">
    <path d="M10 40 L10 20" stroke="#639922" stroke-width="4" fill="none"/>
    <ellipse cx="10" cy="14" rx="10" ry="16" fill="#97C459" transform="rotate(-20 10 14)"/>
    <ellipse cx="18" cy="18" rx="8" ry="14" fill="#639922" transform="rotate(25 18 18)"/>
    <rect x="0" y="40" width="20" height="18" rx="3" class="deep-orange"/>
  </g>
</svg>
